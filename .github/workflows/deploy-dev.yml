name: Deploy Dev Preview

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The dev preview is served from a subfolder, so assets need that base.
      - name: Build
        run: npm run build
        env:
          VITE_BASE: /moduluxe-designer/dev/

      # Publishes to /dev/ on the gh-pages branch; the production files
      # at the root are left untouched.
      - name: Deploy preview to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: dev
          keep_files: true
